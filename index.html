<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUMBLEVERSE - Ultimate Word Solver</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #000; color: #00ff00; font-family: 'Courier New', Courier, monospace; padding: 20px; display: flex; justify-content: center; }
        .wrapper { display: flex; gap: 20px; max-width: 1200px; width: 100%; justify-content: center; }
        .sidebar-ad { width: 160px; height: 600px; border: 2px dashed #333; background: #0a0a0a; display: flex; align-items: center; justify-content: center; color: #444; font-size: 0.8rem; text-align: center; padding: 10px; }
        .container { flex: 1; max-width: 800px; border: 3px solid #00ff00; padding: 30px; box-shadow: 0 0 20px #00ff00; border-radius: 10px; background: #050505; text-align: center; }
        h1 { font-size: 3rem; margin-bottom: 20px; letter-spacing: 5px; text-shadow: 0 0 10px #00ff00; }
        .input-group { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; }
        input { background: #000; border: 2px solid #00ff00; color: #00ff00; padding: 12px 20px; font-size: 1.2rem; font-family: inherit; width: 60%; outline: none; border-radius: 5px; }
        input:focus { box-shadow: 0 0 10px #00ff00; }
        button { background: #00ff00; color: #000; border: none; padding: 12px 25px; font-size: 1.2rem; font-weight: bold; font-family: inherit; cursor: pointer; border-radius: 5px; transition: 0.3s; }
        button:hover { background: #000; color: #00ff00; border: 2px solid #00ff00; box-shadow: 0 0 10px #00ff00; }
        .notice { font-size: 0.9rem; color: #888; margin-bottom: 25px; }
        .error-box { border: 2px dashed #ff0000; color: #ff0000; padding: 15px; margin-top: 20px; border-radius: 5px; display: none; background: #100000; text-align: left; }
        .error-title { font-weight: bold; margin-bottom: 8px; }
        .slang-list { list-style: none; padding-left: 10px; }
        .slang-item { margin-bottom: 5px; }
        .results-container { margin-top: 30px; text-align: left; }
        .length-section { margin-bottom: 20px; border: 1px solid #00ff00; padding: 15px; border-radius: 5px; background: #020a02; }
        .length-title { font-size: 1.3rem; font-weight: bold; border-bottom: 1px solid #00ff00; padding-bottom: 5px; margin-bottom: 10px; color: #fff; }
        .word-grid { display: flex; flex-wrap: wrap; gap: 10px; }
        .word-card { background: #000; border: 1px solid #00ff00; padding: 5px 12px; border-radius: 3px; font-size: 1.1rem; }
        .loading { font-size: 1.2rem; color: #ffff00; margin: 20px 0; display: none; }
        .no-results { color: #ff9900; margin: 20px 0; font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- বাম পাশের অ্যাড বক্স (এখানে Adsterra কোড বসাবেন) -->
    <div class="sidebar-ad">
        <!-- বাম পাশের বিজ্ঞাপনের কোড নিচে পেস্ট করুন -->
        PLACE LEFT AD HERE
    </div>

    <div class="container">
        <h1>JUMBLEVERSE</h1>
        
        <div class="input-group">
            <input type="text" id="jumbleInput" placeholder="Enter scrambled letters..." autocomplete="off">
            <button onclick="processJumble()">SOLVE IT</button>
        </div>
        <div class="notice">* MAXIMUM 17 LETTERS ALLOWED</div>

        <div id="loadingStatus" class="loading">SCANNING CODES & DICTIONARY...</div>

        <!-- আপত্তিকর শব্দের বক্স -->
        <div id="errorBox" class="error-box">
            <div class="error-title">⚠️ HEX OFFENSIVE WORDS DETECTED</div>
            <ul id="slangList" class="slang-list"></ul>
        </div>

        <!-- আসল রেজাল্ট দেখানোর বক্স -->
        <div id="resultsArea" class="results-container"></div>
    </div>

    <!-- ডান পাশের অ্যাড বক্স (এখানে Adsterra কোড বসাবেন) -->
    <div class="sidebar-ad">
        <!-- ডান পাশের বিজ্ঞাপনের কোড নিচে পেস্ট করুন -->
        PLACE RIGHT AD HERE
    </div>
</div>

<script>
    const badWords = ['penis', 'peni', 'sex', 'fuck', 'ass', 'bitch'];

    async function processJumble() {
        const inputField = document.getElementById('jumbleInput');
        const resultsArea = document.getElementById('resultsArea');
        const errorBox = document.getElementById('errorBox');
        const slangList = document.getElementById('slangList');
        const loadingStatus = document.getElementById('loadingStatus');

        const inputValue = inputField.value.trim().toLowerCase();
        
        resultsArea.innerHTML = '';
        errorBox.style.display = 'none';
        slangList.innerHTML = '';

        if (!inputValue) {
            resultsArea.innerHTML = '<div class="no-results">Please enter some letters first!</div>';
            return;
        }

        loadingStatus.style.display = 'block';

        try {
            const response = await fetch(`/api/solve?input=${encodeURIComponent(inputValue)}`);
            if (!response.ok) throw new Error('Network error or server limit');
            
            const data = await response.json();
            loadingStatus.style.display = 'none';

            let hasWords = false;
            let detectedBadWords = [];

            const sortedLengths = Object.keys(data).sort((a, b) => b - a);

            sortedLengths.forEach(length => {
                const wordsArray = data[length] || [];
                
                const cleanWords = wordsArray.filter(word => {
                    if (badWords.includes(word.toLowerCase())) {
                        if (!detectedBadWords.includes(word.toUpperCase())) {
                            detectedBadWords.push(word.toUpperCase());
                        }
                        return false;
                    }
                    return true;
                });

                if (cleanWords.length > 0) {
                    hasWords = true;
                    
                    const section = document.createElement('div');
                    section.className = 'length-section';
                    
                    const title = document.createElement('div');
                    title.className = 'length-title';
                    title.innerText = `${length} LETTER WORDS (${cleanWords.length})`;
                    
                    const grid = document.createElement('div');
                    grid.className = 'word-grid';
                    
                    cleanWords.forEach(word => {
                        const card = document.createElement('div');
                        card.className = 'word-card';
                        card.innerText = word.toUpperCase();
                        grid.appendChild(card);
                    });
                    
                    section.appendChild(title);
                    section.appendChild(grid);
                    resultsArea.appendChild(section);
                }
            });

            if (detectedBadWords.length > 0) {
                errorBox.style.display = 'block';
                detectedBadWords.forEach(slang => {
                    const li = document.createElement('li');
                    li.className = 'slang-item';
                    li.innerText = `▲ SLANG DETECTED & FILTERED: ${slang}`;
                    slangList.appendChild(li);
                });
            }

            if (!hasWords) {
                resultsArea.innerHTML = '<div class="no-results">No meaningful words found for these letters.</div>';
            }

        } catch (error) {
            loadingStatus.style.display = 'none';
            resultsArea.innerHTML = `<div class="no-results" style="color:red;">Error connecting to solver system: ${error.message}</div>`;
        }
    }

    document.getElementById('jumbleInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            processJumble();
        }
    });
</script>

</body>
</html>
